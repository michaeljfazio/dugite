[package]
name = "dugite-fuzz"
version = "2.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Structured generation (#974). Every target used to be `|data: &[u8]|`, which
# bounds the reachable encoder surface to what a byte mutator can synthesise —
# the mechanical reason the v2.4.1-v2.4.5 encoder wave went undetected.
arbitrary = { version = "1", features = ["derive"] }
num-bigint = { version = "0.4", features = ["serde"] }
bincode = "1"
minicbor = { version = "0.25", features = ["std"] }
imbl = { version = "7.0.0", features = ["serde"] }
dugite-serialization = { path = "../crates/dugite-serialization" }
dugite-network = { path = "../crates/dugite-network" }
dugite-primitives = { path = "../crates/dugite-primitives" }
dugite-ledger = { path = "../crates/dugite-ledger" }
dugite-mempool = { path = "../crates/dugite-mempool" }
dugite-lsm = { path = "../crates/dugite-lsm" }
dugite-crypto = { path = "../crates/dugite-crypto" }
dugite-consensus = { path = "../crates/dugite-consensus" }
dugite-storage = { path = "../crates/dugite-storage" }
# #975: dugite-cli's key-envelope parsers — #935's strict replacement for a
# heuristic that silently ate a byte 1-in-8.
dugite-cli = { path = "../crates/dugite-cli" }
# #983: dugite-rpc's INBOUND mapping layer — attacker-controlled protobuf
# turned into ledger types. Unlike dugite-node this crate pulls in no
# mithril-client, so it can be a normal dependency (no `#[path]` inclusion).
dugite-rpc = { path = "../crates/dugite-rpc" }
#
# dugite-node is deliberately NOT a dependency. It pulls in mithril-client,
# whose native deps (blst, aws-lc-sys) and `inventory`/`typetag` static
# initializers do not survive sancov instrumentation — `ld: initializer pointer
# has no target`. Adding it broke the build of ALL 56 targets, not just the new
# ones.
#
# The node's parse surface is reached instead by compiling the individual
# source files into the targets that need them (`#[path]`), which works because
# genesis.rs and topology.rs have no `crate::` references at all and
# n2c_query/encoding.rs references only its sibling `types`. Same technique
# dugite-node's own lib.rs uses. See fuzz_targets/genesis_parse.rs.
serde_json = "1"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
bech32 = "0.11"
# In-house UPLC implementation — the decoder/evaluator that runs in production.
# This is the target the new fuzz_dugite_uplc_* binaries exercise; the upstream
# aiken `uplc` dep below is kept around for the upstream-bug-surface targets.
dugite-uplc = { path = "../crates/dugite-uplc" }
# Direct uplc dep surfaces eval_phase_two_raw, Program::from_cbor/from_flat,
# uplc::plutus_data, and apply_params_to_script for Plutus Phase-4 fuzz targets.
uplc = { git = "https://github.com/aiken-lang/aiken.git", rev = "6806d52211fbb469ae13aa0e0290aeb6b9b3e8cf" }
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

# Shared structured generators for the encode-first targets (#974).
[lib]
name = "dugite_fuzz"
path = "src/lib.rs"

