# Byron-era block decode (issue #613). Wraps fuzzer bytes in a Byron era
# envelope so mutation exercises decode_byron_main_block /
# decode_byron_ebb_block specifically — random mutation through decode_block
# would otherwise converge on the richer Shelley+ tags.
[[bin]]
name = "fuzz_byron_block_decode"
path = "fuzz_targets/byron_block_decode.rs"
doc = false

# ── Encode-first structured targets (#974) ──────────────────────────────────
#
# These invert the direction of every other target: they GENERATE the
# structure and require the decoder to reproduce it, instead of requiring the
# fuzzer to synthesise valid CBOR before the encoder runs at all.

# Whole-transaction round-trip over generated bodies, certificates,
# governance, witness sets and auxiliary data.
[[bin]]
name = "fuzz_structured_tx_encode"
path = "fuzz_targets/structured_tx_encode.rs"
doc = false

# ProtocolParamUpdate keys 0-37. This is the shape #951 lived in: PPU key 26
# wrote the ten drep_voting_thresholds in the wrong order, and the decoder was
# right, so a generated round-trip separates them immediately.
[[bin]]
name = "fuzz_structured_pparam_update"
path = "fuzz_targets/structured_pparam_update.rs"
doc = false

# ── dugite-node / dugite-cli parse surface (#975) ───────────────────────────
#
# Six of sixteen workspace crates were not fuzz dependencies at all. These are
# the three with real untrusted-input parse surface and a defect history.

# Genesis JSON. A parse bug here is a consensus divergence, not just a crash:
# v2.2.0's 1e6-denominator float->rational silently broke priceSteps, a0, rho,
# tau and every governance threshold.
[[bin]]
name = "fuzz_genesis_parse"
path = "fuzz_targets/genesis_parse.rs"
doc = false

# Topology JSON — peer addresses, DNS names, valency arithmetic.
[[bin]]
name = "fuzz_topology_parse"
path = "fuzz_targets/topology_parse.rs"
doc = false

# The N2C GetCurrentPParams reply: a POSITIONAL array(31) per Haskell
# ConwayPParams. CLAUDE.md flags conflating it with the sparse map as a
# standing trap; the sparse side had coverage, this side had none.
[[bin]]
name = "fuzz_n2c_pparams_encode"
path = "fuzz_targets/n2c_pparams_encode.rs"
doc = false

# dugite-cli key-envelope parsing (#935's strict replacement).
[[bin]]
name = "fuzz_cli_envelope"
path = "fuzz_targets/cli_envelope.rs"
doc = false
