# The ledger-rules expected-results contract (#1125, Phase 2b of #1114).
#
# One entry per fixture dugite is KNOWN not to match: `(id, observed result)` plus the open issue that
# holds the evidence.  This is NOT a skip list.  The gate (`ledger_rules_gate`) fails when
#
#   * an entry names an id that is not a fixture, or an entry has no issue number or no class;
#   * a fixture does not match and has no entry (a new divergence);
#   * an entry's fixture now MATCHES (remove the entry: a fix must not go unnoticed);
#   * an entry's `observed` is not what dugite now produces (the divergence changed).
#
# `expected` is the fixture's expectation (`ValidationTagMismatch(PassedUnexpectedly)` carries the
# narrowing the report cannot); `observed` is read off the ApplyTxErr bytes dugite emits, through the
# tag table transcribed from cardano-ledger, never from dugite's own error type.  `unmapped:<X>` means
# dugite rejected the transaction with a failure that has no scenario name (`ConwayMempoolFailure` is
# dugite's generic fallback: a failure, never a match).
#
# Every `issue` must be OPEN (`scripts/node-diversity/check-expected-issues.sh`, run by the CI gate job).
# Do not edit an entry to make a number match: fix the ledger, then delete the entry.

