[package]
name = "dugite-conformance"
version.workspace = true
edition.workspace = true
description = "Formal ledger specification conformance tests for Dugite"

[dependencies]
dugite-primitives = { workspace = true }
dugite-crypto = { workspace = true }
dugite-serialization = { workspace = true }
dugite-ledger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
num-bigint = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# Optional: only compiled when upstream-conformance feature is active.
minicbor   = { workspace = true, optional = true }
# Pin to anweiss/cddl main branch: range map keys (* N..M => rule) and array map
# keys ({ + [k1, k2] => v }) were added in PR #536 (merged 2026-05-13), after the
# last crates.io release (0.10.5, 2026-04-02).  Update to a crates.io version once
# 0.10.6 is published.
cddl = { git = "https://github.com/anweiss/cddl.git", branch = "main", optional = true }

[features]
upstream-conformance = ["dep:minicbor", "dep:cddl"]

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "upstream_tests"
path = "tests/upstream_tests.rs"
required-features = ["upstream-conformance"]
