[package]
name = "dugite-conformance"
version.workspace = true
edition.workspace = true
description = "Formal ledger specification conformance tests for Dugite"
build = "build.rs"

[dependencies]
dugite-primitives = { workspace = true }
dugite-crypto = { workspace = true }
dugite-serialization = { workspace = true }
dugite-ledger = { workspace = true }
# ledger-rules runner (#1125): the SAME rejection conversion and ApplyTxErr encoder the node uses,
# and the era history the node builds its per-tx horizon from.
dugite-network = { workspace = true }
dugite-tx-admission = { workspace = true }
dugite-consensus = { workspace = true }
# The uplc-conformance runner evaluates through dugite-uplc's production gated path; `parser` is
# needed for the vectors that exist only as textual UPLC (constants flat cannot carry).
dugite-uplc = { workspace = true, features = ["parser"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
num-bigint = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
# node-diversity harness (#1116): pin file, report timestamps, and validation of
# every report against the scenario's own JSON Schema (draft 2020-12, with
# `format` assertions on).  `default-features = false` drops the HTTP resolvers:
# schemas are read from the pinned, locally fetched corpus, never from the network.
toml = { workspace = true }
chrono = { workspace = true }
jsonschema = { version = "0.63", default-features = false }
# The ledger-rules runner decodes the ApplyTxErr bytes with it; the upstream-conformance feature
# uses it too.
minicbor   = { workspace = true }
# Pin to anweiss/cddl main branch: range map keys (* N..M => rule) and array map
# keys ({ + [k1, k2] => v }) were added in PR #536 (merged 2026-05-13), after the
# last crates.io release (0.10.5, 2026-04-02).  Update to a crates.io version once
# 0.10.6 is published.
cddl = { git = "https://github.com/anweiss/cddl.git", branch = "main", optional = true }

[features]
upstream-conformance = ["dep:cddl"]

[dev-dependencies]
tempfile = { workspace = true }
# ledger-rules: the oracle (cardano-node) report ships zstd-compressed in the NDC checkout.
zstd = { workspace = true }

[[test]]
name = "upstream_tests"
path = "tests/upstream_tests.rs"
required-features = ["upstream-conformance"]
