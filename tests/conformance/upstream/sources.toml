# Upstream source pins for the conformance corpus regeneration pipeline.
# Bumping a pin here and triggering the regenerate-conformance-corpus
# workflow produces a new dugite release that manifest.toml then points at.
#
# See also: manifest.toml (which release consumers pull from)

[ouroboros-consensus]
repo = "IntersectMBO/ouroboros-consensus"
sha  = "f205a7103deb732cc07cabd51fa76ce22f84f0d0"

[cardano-ledger]
repo = "IntersectMBO/cardano-ledger"
sha  = "a88b60bdcf3248dfe5a2f9372c188c399233f479"

[cardano-node]
repo = "IntersectMBO/cardano-node"
sha  = "0a21a7437fb9d38060b297c5997275d316e60d5c"

[plutus]
# Conformance vectors live inside the source tarball at:
#   plutus-<TAG>/plutus-conformance/test-cases/uplc/evaluation/
# The capture script downloads the source archive (not a release asset).
#
# 1.65.0.0 → 1.66.0.0 (released 2026-07-15): 999 → 1003 evaluation cases.
# The `builtin/constant/value` area was reworked — `key-*` cases were renamed to
# `currencyID-*`/`tokenID-*`, and non-canonical `value` literals changed from
# NORMALISED to REJECTED:
#   * 1.65 `duplicate-keys`  expected the amounts summed  (123 + 456 = 579)
#   * 1.66 `duplicate-tokenIDs` expects `parse error`
# plus new `parse error` cases for unordered currencyIDs/tokenIDs, empty token
# maps and zero amounts. `syn::parser::parse_value_literal` was tightened to
# match; see its doc comment.
#
# NOTE: that parser behaviour is corpus-version-coupled — the two expectations
# are mutually exclusive, so this pin and the `manifest.toml` release tag must be
# advanced together (regenerate the corpus, then bump `[release].tag`).
repo = "IntersectMBO/plutus"
tag  = "1.66.0.0"

[ledger-rules]
# This area builds cardano-ledger + runs ImpSpec with CONFORMANCE_CBOR_DUMP_PATH.
# The SHA below is the cardano-ledger version we build/run against.
# Wired up in Phase 4; stub tarball produced until then.
repo = "IntersectMBO/cardano-ledger"
sha  = "a88b60bdcf3248dfe5a2f9372c188c399233f479"

[cardano-base]
