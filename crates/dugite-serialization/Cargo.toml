[package]
name = "dugite-serialization"
version.workspace = true
edition.workspace = true
description = "CBOR serialization for Cardano wire format compatibility"

[features]
default = ["pallas-shadow-decode"]
# Compiles the legacy pallas-backed decoder alongside the in-house one and
# enables the runtime dual-decode comparator (controlled by DUGITE_DUAL_DECODE
# at runtime). Keep ON during the pallas-removal program (plan: humming-dewdrop).
# Flipped OFF at the M6 cutover, at which point the pallas decoder is deleted
# entirely and only the in-house path remains.
pallas-shadow-decode = []

[dependencies]
dugite-primitives = { workspace = true }
minicbor = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
pallas-primitives = { workspace = true }
pallas-traverse = { workspace = true }
pallas-codec = { workspace = true }
pallas-crypto = { workspace = true }
tracing = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }

[[bench]]
name = "serialization_bench"
harness = false
