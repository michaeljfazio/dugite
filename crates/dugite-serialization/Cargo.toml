[package]
name = "dugite-serialization"
version.workspace = true
edition.workspace = true
description = "CBOR serialization for Cardano wire format compatibility"

[dependencies]
dugite-primitives = { workspace = true }
minicbor = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
crc32fast = { workspace = true }

[features]
# Rule-level decode/encode entry points for the node-diversity cbor-decoding conformance harness
# (`tests/conformance`).  Not enabled by this crate or by the node; `tests/conformance` enables it,
# and it is a default workspace member, so a workspace-wide build turns it on through feature
# unification.  Nothing in the node calls the entry points.
conformance-rules = []

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }

[[bench]]
name = "serialization_bench"
harness = false
