[package]
name = "dugite-ledger"
version.workspace = true
edition.workspace = true
description = "Ledger rules and UTxO management for Dugite"

[dependencies]
dugite-primitives = { workspace = true }
dugite-crypto = { workspace = true }
dugite-serialization = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
minicbor = { workspace = true }
sha3 = { workspace = true }
bincode = { workspace = true }
dugite-uplc = { workspace = true }
dugite-lsm = { workspace = true }
rayon = { workspace = true, optional = true }
imbl = { workspace = true }

[features]
default = ["parallel-verification"]
parallel-verification = ["rayon"]
# Compile in the per-epoch-boundary reward-debug dumper.
# When this feature is enabled, setting `DUGITE_REWARD_DEBUG_DUMP=<dir>` at
# runtime writes per-boundary JSON snapshots of every active pool's GO
# snapshot, reward-account balances, and computed RUPD credits.  Used to
# bisect path-dependent reward divergences (see issue #438 / #471).
# Off by default — production builds incur zero overhead.
reward-debug-dump = []
# Compile in the per-epoch-boundary FULL ledger-state dumper.
# When this feature is enabled, setting `DUGITE_EPOCH_STATE_DUMP=<dir>` at
# runtime writes one JSON file per epoch boundary capturing nonce, UTxO,
# stake-snapshot, pool, reward, and governance state for cross-validation
# against `cardano-cli debug log-epoch-state` (tasks #21/#22/#23).
# Off by default — production builds incur zero overhead.
epoch-state-debug = []

[dev-dependencies]
serde_json = { workspace = true }
hex = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
# Test-only: building genuinely-signed Byron fixtures for #1092's
# signature-verification tests. A real Ed25519 signature verifies
# identically under dalek and donna (see dugite-crypto::byron's doc), so
# dalek-signed fixtures are a valid basis for exercising the donna-exact
# `verify_xsig` production path.
ed25519-dalek = { workspace = true }
# Test-only: decoding the real mainnet `heavyDelegation` genesis certificates
# (base64 keys) for #1092's primary offline correctness test.
base64 = { workspace = true }

[[bench]]
name = "ledger_bench"
harness = false
