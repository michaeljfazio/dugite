[package]
name = "dugite-cli"
version.workspace = true
edition.workspace = true
description = "CLI tool for Dugite Cardano node (cardano-cli compatible)"

[[bin]]
name = "dugite-cli"
path = "src/main.rs"

[[bin]]
name = "capture-ratification-fixture"
path = "src/bin/capture_ratification_fixture.rs"

[dependencies]
dugite-primitives = { workspace = true }
dugite-crypto = { workspace = true }
dugite-serialization = { workspace = true }
dugite-network = { workspace = true }
dugite-consensus = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
bech32 = { workspace = true }
minicbor = { workspace = true }
rand = { workspace = true }
blake2 = { workspace = true }
reqwest = { workspace = true }
bs58 = { workspace = true }
sha3 = { workspace = true }
blake2b_simd = { workspace = true }
crc32fast = { workspace = true }
curve25519-dalek-fork = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
