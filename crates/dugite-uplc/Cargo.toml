[package]
name = "dugite-uplc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Untyped Plutus Core (UPLC) evaluator, flat/CBOR codec, and CEK machine for the dugite Cardano node"
# Generates per-test #[test] functions from the conformance corpus (when
# `tests/conformance/` is populated by scripts/dev/download-plutus-conformance.sh).
build = "build.rs"

[lints.rust]
# `unsafe` is forbidden everywhere except the BLS12-381 module, which
# wraps the audited `blst` C library via raw FFI. That module
# explicitly opts in via `#[allow(unsafe_code)]` on the items that
# need it; nothing else in the crate may use `unsafe`.
unsafe_code = "deny"

[dependencies]
# Crypto primitives (BLS12-381, ed25519, sha2/3, blake2, keccak256, ripemd160,
# secp256k1) for the Cardano-specific UPLC builtins. We deliberately avoid
# any third-party UPLC implementation here; only crypto primitives.
blake2 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
# keccak_256 comes from `sha3::Keccak256` (sha3 crate ships the
# keccak permutation in addition to NIST SHA-3).
# ripemd_160 needs its own crate — sha3 doesn't expose it.
ripemd = "0.2"
# `digest::Digest` is the unifying trait we call into across all five
# hash families; pull it in explicitly so the trait is in scope.
digest = "0.11"

# ed25519 signature verification — Cardano uses the non-strict
# verifier (matches RFC 8032 plus the older permissive-cofactor
# behaviour). ed25519-dalek's default `verify` matches.
ed25519-dalek = { workspace = true }

# secp256k1 — ECDSA + Schnorr. We use `k256` (pure Rust) to avoid the
# secp256k1-sys C dependency. Cardano's CIP-49 ECDSA matches the
# default `k256::ecdsa` verifier (low-S-normalised, fixed 64-byte
# signatures); Schnorr matches BIP-340 (`k256::schnorr`).
k256 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "schnorr", "sha256"] }

# BLS12-381 — Cardano CIP-0381 mandates the IETF/zkcrypto compressed
# serialisation (48-byte G1 / 96-byte G2) with strict subgroup checks
# and the IETF hash-to-curve ciphersuite (BLS12381G[12]_XMD:SHA-256_SSWU_RO_).
# `blst` is the cardano-node reference and the only Rust binding that
# matches mainnet byte-for-byte. C/asm under the hood, but no
# transitive pallas chain — direct FFI to a self-contained library.
blst = "0.3"

# Integer arithmetic for the `integer` and rational-cost-model paths.
num-bigint = { workspace = true }
num-traits = { workspace = true }

# CBOR for the outer Program envelope and the `Data` type. We use minicbor
# (not pallas-codec) to keep dugite-uplc free of the pallas dependency chain.
minicbor = { workspace = true }

# Stack growth for deeply-nested UPLC term decoding. Real-world DeFi scripts
# can exceed 500 nesting levels; `stacker::maybe_grow` extends the OS stack
# transparently without changing the recursion structure of the decoder.
stacker = "0.1"

# Logging.
tracing = { workspace = true }

# Errors.
thiserror = { workspace = true }

# Hex display for Data debug output.
hex = { workspace = true }

# In-house tx + utxo decoders for phase-2. Used by `phase_two.rs` to lift
# the raw CBOR the ledger passes us into typed `Transaction` / `TransactionInput`
# / `TransactionOutput` values before TxInfo construction. Both dugite-primitives
# and dugite-serialization are first-party crates with no third-party UPLC
# dependency, so they do not violate the "no aiken-uplc, no pallas, no
# amaru-uplc" rule.
dugite-primitives = { workspace = true }
dugite-serialization = { workspace = true }

# Cross-validation only — pragma-org/uplc (`amaru-uplc`) is pinned at a
# stable revision and used solely by `tests/cross_validate_*.rs` to
# differential-test our codecs against another Rust UPLC implementation.
# Gated behind the `cross-validate` feature so the default build never
# pulls it in; production code MUST NOT reference it. This dependency is
# never exposed in the runtime build, so it does not affect the
# production dependency graph or the no-third-party-UPLC rule.
amaru-uplc = { git = "https://github.com/pragma-org/uplc.git", rev = "fd5e970a5d9b345a2f0a43600e27be9827313c05", optional = true }
# amaru-uplc uses minicbor 0.25; dugite-uplc itself uses 0.26 (workspace
# default). Pull in 0.25 under a different package name so the
# cross-validation tests can speak amaru-uplc's `Encode<()>` trait.
minicbor_025 = { package = "minicbor", version = "0.25", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[features]
# Enables the cross-validation tests in `tests/cross_validate_*.rs`. The
# CI workflow runs `cargo test --features cross-validate` on every PR
# that touches `crates/dugite-uplc/`.
cross-validate = ["dep:amaru-uplc", "dep:minicbor_025"]

# Enables `dugite_uplc::syn` — a first-party textual UPLC parser that
# accepts the s-expression form documented in the Plutus Core formal
# specification. Used only off the production code path; the on-chain
# wire format is the flat encoding handled by `dugite_uplc::flat`. Kept
# behind a feature flag so default builds do not compile parser code.
parser = []

# Enables the UPLC evaluation conformance harness in `tests/conformance.rs`.
# Test vectors are downloaded by `scripts/dev/download-plutus-conformance.sh`
# into `tests/conformance/`. The harness consumes the textual .uplc files
# via the first-party `parser` feature — no third-party UPLC parser is
# linked in.
# upstream-conformance is the canonical name for Phase 1+ (unified fixture root).
# conformance is kept as an alias so existing `--features conformance` invocations
# keep working without modification.
upstream-conformance = ["parser"]
conformance = ["upstream-conformance"]

[lib]
name = "dugite_uplc"
path = "src/lib.rs"
