name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-tags: the workspace test suite includes version-seam guards
      # that read `git tag --list` (e.g. a SNAPSHOT_VERSION collision check)
      # to decide whether a layout has shipped. The default shallow clone
      # carries no tags at all, so `git tag --list` returns empty and any
      # such guard's tag-gated branch silently never fires here — the exact
      # blindness that let xtask/tests/snapshot_one_bump_invariant.rs stay
      # green in CI while red on a real checkout.
      #
      # fetch-depth: 0 (full history): xtask/tests/qa_report_covers_shipped_code.rs
      # walks commit ancestry (`git log -1 -- crates`, `git merge-base
      # --is-ancestor`) between the QA report's recorded git_rev and the
      # newest commit touching crates/. A shallow clone (the default
      # fetch-depth: 1, unaffected by fetch-tags alone) carries only the tip
      # commit, so any older commit — including the report's own git_rev one
      # commit back — is invisible and the ancestry check fails with "not a
      # commit in this repository", not the staleness verdict it exists to
      # report.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install protoc
        # dugite-rpc's build.rs invokes tonic-build → prost-build → protoc to
        # codegen the vendored utxorpc/spec proto files. See issue #672.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-targets

      - name: Guard against pallas-network re-entry
        run: |
          if cargo tree --workspace --prefix none 2>/dev/null | grep -qi '^pallas-network '; then
            echo "::error::pallas-network is in the dependency tree; it was removed and must stay removed."
            cargo tree --workspace -i pallas-network || true
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The fuzz crate declares `[workspace] members = ["."]`, so it is NOT
      # part of the main workspace and `cargo build --all-targets` above never
      # compiles it. Without this guard a crate API change silently breaks a
      # fuzz target and the only signal is a nightly job failing to build —
      # which is how 11 targets sat unnoticed for 2.5 months (#971).
      #
      # `check` on stable, not `build` on nightly: this is a compile guard, not
      # a fuzzing run, and it must not add a nightly toolchain to the gate.
      - name: Guard — fuzz targets still compile
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run all tests (unit, property, conformance, golden)
        run: cargo nextest run --workspace --profile ci

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  upstream-conformance:
    name: Upstream conformance (UPLC + golden decode)
    runs-on: ubuntu-latest
    # The corpus is pinned via tests/conformance/upstream/manifest.toml.
    # Updating the pin: edit sources.toml, trigger regenerate-conformance-corpus
    # workflow, bump manifest.toml tag, and refresh conformance_skip.txt.
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-conformance-
            ${{ runner.os }}-cargo-

      - name: Cache upstream conformance fixtures
        uses: actions/cache@v6
        with:
          path: tests/conformance/upstream/fixtures
          key: upstream-fixtures-${{ hashFiles('tests/conformance/upstream/manifest.toml') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Download upstream conformance fixtures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask download-upstream-fixtures

      - name: Run the full UPLC evaluation conformance suite
        env:
          DUGITE_REQUIRE_UPSTREAM: "1"
        run: cargo nextest run -p dugite-uplc --features conformance --test conformance --profile ci

      - name: Run upstream golden decode tests
        env:
          DUGITE_REQUIRE_UPSTREAM: "1"
        run: cargo nextest run -p dugite-conformance --features upstream-conformance --test upstream_tests --profile ci

      - name: Upload conformance test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — see build-and-test's checkout step for why
      # xtask/tests/qa_report_covers_shipped_code.rs needs full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Cache upstream conformance fixtures
        uses: actions/cache@v6
        with:
          path: tests/conformance/upstream/fixtures
          key: upstream-fixtures-${{ hashFiles('tests/conformance/upstream/manifest.toml') }}

      - name: Download upstream conformance fixtures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask download-upstream-fixtures

      # Run the conformance suite alongside the rest of the workspace so the
      # lines it covers in `dugite-crypto` (v13 VRF), `dugite-uplc` (builtins,
      # populate paths) and `dugite-serialization` (era CBOR decoders) count
      # toward the reported numbers — they're real tests, just gated on
      # upstream fixtures. `--exclude-from-report` keeps the conformance crate
      # itself out of the percentage (it is pure test scaffolding).
      #
      # Pure binary entrypoints and the ratatui TUI render layers are excluded
      # via `--ignore-filename-regex` because they aren't reachable from
      # `cargo test` and dragging them through the denominator distorts the
      # picture without representing real risk.
      - name: Generate code coverage
        env:
          DUGITE_REQUIRE_UPSTREAM: "1"
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --exclude dugite-integration-tests \
            --exclude-from-report dugite-conformance \
            --ignore-filename-regex '(src/main\.rs|/ui\.rs|/bin/capture_)' \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  cli-surface-parity:
    name: cardano-cli / dugite-cli subcommand surface parity (#1006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-surface-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-surface-
            ${{ runner.os }}-cargo-

      - name: Build dugite-cli
        run: cargo build -p dugite-cli

      - name: Selftest the walker/parser against fixture stubs
        # No real binaries needed — proves the check's OWN logic (MISSING
        # detection, allowlist coverage, stale-allowlist detection,
        # superset non-failure, INCONCLUSIVE-never-PASS) is correct,
        # independent of whatever cardano-cli happens to ship this week.
        run: ./scripts/validation/cli-surface-parity-selftest.sh

      - name: Download cardano-cli release (pinned to the version this project targets for parity)
        run: |
          set -euo pipefail
          ver="11.0.0.0"
          base="https://github.com/IntersectMBO/cardano-cli/releases/download/cardano-cli-${ver}"
          # Download under the asset's REAL name: sha256sums.txt lists the
          # original filename, and `sha256sum -c -` resolves that name on
          # disk. Saving as cardano-cli.tar.gz made the check look for a
          # file that was never created ("No such file or directory").
          tarball="cardano-cli-${ver}-x86_64-linux.tar.gz"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o sha256sums.txt "${base}/cardano-cli-${ver}-sha256sums.txt"
          grep "x86_64-linux.tar.gz" sha256sums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          # The archive contains a single file named cardano-cli-x86_64-linux,
          # not cardano-cli — verified by inspecting the real release asset
          # (`tar -tzf`) rather than assumed.
          tar -xzf "${tarball}" -C "$HOME/.local/bin"
          mv "$HOME/.local/bin/cardano-cli-x86_64-linux" "$HOME/.local/bin/cardano-cli"
          chmod +x "$HOME/.local/bin/cardano-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the real cardano-cli vs dugite-cli surface parity check
        run: |
          cardano-cli --version
          ./scripts/validation/cli-surface-parity.sh

  integration-offline:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binaries
        run: cargo build --release -p dugite-cli -p dugite-node

      - name: Run offline integration tests
        run: cargo test -p dugite-integration-tests -- tier0

  release-binaries:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test, integration-offline]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dugite-linux-x86_64
          # Use the native aarch64 runner instead of cross-compiling: the
          # bundled gmp-mpfr-sys (via mithril-stm → rug) cannot cross-build
          # its arch-specific assembly across host architectures.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: dugite-linux-aarch64
          # x86_64-apple-darwin is dropped: GitHub macOS runners are aarch64-only
          # and bundled GMP cannot cross-compile under Apple Silicon clang.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dugite-macos-aarch64
          # Windows disabled: fs2 file locking behaves differently on MSVC.
          # Re-enable when dugite-lsm session_lock.rs is ported to Windows.
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   artifact: dugite-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p dugite-node -p dugite-cli

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dugite-node dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/dugite-cli dist/ 2>/dev/null || true
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          retention-days: 30
