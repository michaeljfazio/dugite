name: Fuzz Testing

on:
  schedule:
    # Mon-Sat 02:00 UTC — short run over every target.
    - cron: '0 2 * * 1-6'
    # Sunday 02:00 UTC — deep run, an hour per target.
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 'Seconds to fuzz each target'
        required: false
        default: '1200'

env:
  CARGO_HOME: /home/runner/.cargo
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Per-target fuzzing budget.
  #
  # This used to be a flat 3600s every night, which was the right call when
  # every run started from an EMPTY corpus (#972) — an hour was mostly spent
  # re-deriving CBOR framing that a persisted corpus now supplies in the first
  # second. With the corpus cached between runs, coverage ACCUMULATES across
  # nights, so a shorter nightly run is no longer a shorter search: it is the
  # same search, resumed.
  #
  # That is what pays for #971's 11 revived targets plus the new #974/#975
  # ones. The matrix went 41 -> 58 targets while total nightly compute went
  # ~41h (41 x 3600s) -> ~19h (58 x 1200s). The weekly deep run keeps a long
  # uninterrupted search in the schedule for the targets that benefit.
  FUZZ_SECONDS: ${{ github.event.inputs.max_total_time || (github.event.schedule == '0 2 * * 0' && '3600' || '1200') }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Hard ceiling per target: build + fuzz + cmin. Well inside the 6-hour
    # GitHub Actions job limit even on a cold cache and a deep Sunday run.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target:
          # Existing — wire-format and high-level state targets
          - decode_block
          - decode_transaction
          - nonce_update
          - handshake
          - chainsync_msg
          - protocol_params
          - address
          - governance
          - ledger_snapshot
          - tx_validation
          - block_apply
          - encode_roundtrip
          - lsm_operations
          - mempool_admission
          - epoch_transition
          # Phase 1 — wire-protocol coverage (mux + every mini-protocol)
          - mux_demux
          - n2c_query
          - n2c_tx_submission
          - block_fetch_msg
          - tx_submission2_msg
          - keepalive_msg
          - peer_sharing_msg
          # Phase 2 — consensus primitives
          - vrf_verify
          - kes_verify
          - opcert_verify
          - ed25519_verify
          - blake2b_hash
          - chain_select
          - header_field_sizes
          # Phase 3 — storage layer (Mithril skipped — HTTP-coupled, no byte API)
          - immutable_chunk_parse
          - volatile_recovery
          - chaindb_rollback
          # Phase 4 — Plutus / Phase-2
          - plutus_data_decode
          - cost_model_eval
          # Audit #544 — CBOR serialization strictness (D2/D3/D9/D10/D15)
          - vkey_witness_sizes
          - bootstrap_witness_sizes
          - plutus_bignum
          - cbor_skip_value_depth
          - skip_cbor_value
          # Issue #554 D7 — tx metadata decoder allocation cap
          - tx_metadata_decode
          # In-house decoders — production code path for phase-2 validation
          - dugite_uplc_program_decode
          - dugite_uplc_data_decode
          # Issue #545 E5 — body-hash round-trip soundness
          - body_hash
          # Issue #613 — Byron block-header decode hardening
          - byron_block_decode
          # Mini-protocol STATE MACHINES (#971). The message decoders above
          # cannot reach sequencing/state bugs — the layer where #924 (the
          # handshake connection leak) lived.
          - chainsync_client_pipelined_state_machine
          - chainsync_server_state_machine
          - blockfetch_client_recv
          - txsubmission2_server_state_machine
          - peer_sharing_client_addr_injection
          # Deep dispatch + mux ingress (#971). lsq_query_dispatch exists
          # BECAUSE n2c_query only fuzzes the outer frame; it feeds arbitrary
          # CBOR into handle_query_cbor_versioned across all 39 Shelley tags.
          - lsq_query_dispatch
          # #963: the LSQ filter arguments. Distinct from lsq_query_dispatch,
          # which asserts only "no panic" — this one asserts the parsers are
          # fail-CLOSED, i.e. that "no filter, answer for everything" is
          # reported only for input that genuinely encodes it. The pre-#963
          # parsers reported it for the live `cardano-cli` argument bytes.
          - lsq_filter_arg
          # #983: dugite-rpc's inbound protobuf -> ledger mapping. The gRPC
          # surface is opt-in, but it is dugite code turning attacker-chosen
          # bytes into TransactionInput/Point, and it was silently DROPPING
          # anything it could not parse.
          - rpc_inbound
          - mux_ingress
          - propose_versions
          # Encoder-first structured generation (#974). Every other target is
          # decode-first, so the deep optional fields — PPU keys, governance
          # certificates, witness sets — are unreachable by byte mutation.
          # These generate the structure and require the decoder to reproduce
          # it.
          - structured_tx_encode
          - structured_pparam_update
          # dugite-node / dugite-cli parse surface (#975). Six of sixteen
          # workspace crates were not fuzz dependencies at all; these are the
          # three with real untrusted-input parse surface and a defect history.
          - genesis_parse
          - topology_parse
          - n2c_pparams_encode
          - cli_envelope
        # Per-target -max_len overrides. The global default below is 4096, set
        # deliberately: nothing about mutating raw wire bytes needs more, and a
        # smaller cap keeps the in-memory corpus small over an hour.
        #
        # It stops being right for a target whose SEEDS are bigger than the cap
        # (#972). libFuzzer TRUNCATES an oversized seed rather than skipping it,
        # so a 29 KB real block loaded under -max_len=4096 becomes a 4 KB
        # fragment that can only ever exercise the error path — the opposite of
        # the reason it was committed. These caps are set from the largest seed
        # in each directory (see scripts/dev/regen-fuzz-seeds.sh).
        include:
          - target: decode_block
            max_len: 32768
          - target: encode_roundtrip
            max_len: 32768
          - target: body_hash
            max_len: 32768
          - target: decode_transaction
            max_len: 16384
          # Structured targets consume the input as an Arbitrary entropy
          # stream, so the cap bounds how RICH a generated transaction can be
          # rather than how large an input is parsed.
          - target: structured_tx_encode
            max_len: 16384
          - target: structured_pparam_update
            max_len: 8192
          # Real genesis documents run to ~9.5 KB (the Alonzo cost models).
          - target: genesis_parse
            max_len: 16384
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install protoc
        # dugite-rpc's build.rs invokes tonic-build → prost-build → protoc to
        # generate the gRPC stubs. #983 made dugite-rpc a fuzz dependency (the
        # inbound protobuf → ledger mapping is attacker-controlled), which put
        # that build script on the fuzz build path too — every job in this
        # matrix failed to compile until this step existed. ci.yml and
        # release.yml install it in every job that builds; this workflow was
        # simply missed.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target }}-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # The prebuilt cargo-fuzz from taiki-e/install-action is musl-static, and
      # cargo-fuzz uses its compile-time `env!("HOST")` as the default --target.
      # Without an explicit override it asks for x86_64-unknown-linux-musl, which
      # the GNU nightly toolchain doesn't ship and sanitizer can't use anyway
      # (musl static libc is incompatible with -Zsanitizer=address). See #492.
      #
      # rss_limit_mb is raised from the libFuzzer default (2048) to 12288 (12 GB):
      #   - The default cargo-fuzz build enables AddressSanitizer, which roughly
      #     doubles to triples the program's RSS via its shadow memory.
      #   - Over a 1-hour run libFuzzer accumulates a corpus (held in memory)
      #     and a feature/coverage map; combined with glibc's high-water-mark
      #     RSS behaviour the process slowly creeps upward. Successive caps of
      #     2048 → 5120 → 6144 each got pierced by ~1-10 MB about an hour into
      #     the run by a different heavy decoder target (encode_roundtrip,
      #     dugite_uplc_program_decode). The growth is slow but unbounded
      #     enough to defeat any tight ceiling.
      # ubuntu-24.04 hosted runners have 16 GB RAM, so 12 GB leaves ~4 GB for
      # the OS, the artifact-upload step, and any concurrent matrix jobs the
      # runner may co-host.
      #
      # max_len bounds the size of any single generated input to 4 KiB. The
      # default cargo-fuzz max_len is 4 KiB; we previously raised it to 16 KiB
      # then 8 KiB. After observing that nothing about Cardano wire-format
      # decoding genuinely needs > 4 KiB of input to exercise the surface
      # (transaction bodies, block headers, witness sets all fit comfortably),
      # restore the default cap. This meaningfully shrinks the in-memory
      # corpus size at 1-hour scale.
      # ---- Corpus persistence (#972) ----------------------------------------
      #
      # Before this, every nightly run started from a COMPLETELY EMPTY corpus
      # and spent most of its hour re-deriving CBOR framing from scratch. The
      # cache is keyed on run_id (always a miss, so `save` always writes a new
      # entry) with a prefix restore-key, which is GitHub's documented
      # rolling-cache idiom: restore the newest prior entry, save an updated one.
      - name: Restore corpus from the previous nightly run
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/fuzz_${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-v1-${{ matrix.target }}-

      # Committed seeds are the floor: even on a cold cache the fuzzer starts
      # from real on-chain CBOR rather than random bytes. `cp -n` never
      # clobbers a cached input that libFuzzer already minimised.
      - name: Seed corpus from committed seeds
        run: |
          mkdir -p "fuzz/corpus/fuzz_${{ matrix.target }}"
          if [ -d "fuzz/seeds/${{ matrix.target }}" ]; then
            cp -n fuzz/seeds/${{ matrix.target }}/* "fuzz/corpus/fuzz_${{ matrix.target }}/" 2>/dev/null || true
          fi
          echo "corpus size: $(ls -1 "fuzz/corpus/fuzz_${{ matrix.target }}" | wc -l) inputs"

      - name: Run fuzzer
        # timeout-minutes caps the STEP well under the 6-hour GitHub Actions
        # job ceiling. The fuzz budget itself is FUZZ_SECONDS; this only bounds
        # the tail (libFuzzer finishing the in-flight unit, cmin, corpus I/O)
        # so a wedged run fails visibly instead of burning six hours.
        timeout-minutes: 90
        run: cargo +nightly fuzz run fuzz_${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=${{ env.FUZZ_SECONDS }} -rss_limit_mb=12288 -max_len=${{ matrix.max_len || 4096 }}

      # Bound the corpus before caching it — an hour of libFuzzer output is
      # mostly redundant inputs, and an unbounded corpus would eventually
      # dominate both the cache and the next run's startup time.
      - name: Minimize corpus
        if: always()
        timeout-minutes: 20
        run: cargo +nightly fuzz cmin fuzz_${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -rss_limit_mb=12288

      - name: Save corpus for the next nightly run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/fuzz_${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/fuzz_${{ matrix.target }}/
          if-no-files-found: ignore

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts/fuzz_${{ matrix.target }}/
          if-no-files-found: ignore
