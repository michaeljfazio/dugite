name: Fuzz Testing

on:
  pull_request:
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_HOME: /home/runner/.cargo
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # Existing — wire-format and high-level state targets
          - decode_block
          - decode_transaction
          - nonce_update
          - handshake
          - chainsync_msg
          - protocol_params
          - address
          - governance
          - ledger_snapshot
          - tx_validation
          - block_apply
          - encode_roundtrip
          - lsm_operations
          - mempool_admission
          - epoch_transition
          # Phase 1 — wire-protocol coverage (mux + every mini-protocol)
          - mux_demux
          - n2c_query
          - n2c_tx_submission
          - block_fetch_msg
          - tx_submission2_msg
          - keepalive_msg
          - peer_sharing_msg
          # Phase 2 — consensus primitives
          - vrf_verify
          - kes_verify
          - opcert_verify
          - ed25519_verify
          - blake2b_hash
          - chain_select
          # Phase 3 — storage layer (Mithril skipped — HTTP-coupled, no byte API)
          - immutable_chunk_parse
          - volatile_recovery
          - chaindb_rollback
          # Phase 4 — Plutus / Phase-2
          # NOTE: plutus_script_decode is intentionally OMITTED — upstream uplc
          # and pallas-codec panic on malformed input (see top-doc in that file
          # and the catch_unwind guard in dugite-ledger/src/plutus.rs).
          - plutus_data_decode
          - cost_model_eval
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target }}-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run fuzzer (PR — 5 minutes)
        if: github.event_name == 'pull_request'
        run: cargo +nightly fuzz run fuzz_${{ matrix.target }} -- -max_total_time=300

      - name: Run fuzzer (nightly — 1 hour)
        if: github.event_name == 'schedule'
        run: cargo +nightly fuzz run fuzz_${{ matrix.target }} -- -max_total_time=3600

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/fuzz_${{ matrix.target }}/
          if-no-files-found: ignore

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts/fuzz_${{ matrix.target }}/
          if-no-files-found: ignore
