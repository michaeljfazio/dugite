name: Regenerate Conformance Corpus

on:
  schedule:
    # Weekly Sunday 02:00 UTC — keeps corpus current with upstream cardano-ledger HEAD.
    # The cabal store cache (keyed on GHC version + sources.toml SHA) avoids full
    # cold rebuilds; only changed packages are recompiled.
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      area:
        description: "Capture only a specific area (leave blank for all)"
        required: false
        default: ""
      ouroboros_consensus_sha:
        description: "Override ouroboros-consensus SHA (leave blank to use sources.toml)"
        required: false
        default: ""
      cardano_ledger_sha:
        description: "Override cardano-ledger SHA (leave blank to use sources.toml)"
        required: false
        default: ""
      cardano_node_sha:
        description: "Override cardano-node SHA (leave blank to use sources.toml)"
        required: false
        default: ""
      plutus_tag:
        description: "Override plutus tag (leave blank to use sources.toml)"
        required: false
        default: ""

  push:
    branches:
      - main
    paths:
      - "scripts/regenerate-conformance-corpus/**"
      - "tests/conformance/upstream/sources.toml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply workflow_dispatch pin overrides to sources.toml
        if: github.event_name == 'workflow_dispatch'
        env:
          OC_SHA: ${{ github.event.inputs.ouroboros_consensus_sha }}
          CL_SHA: ${{ github.event.inputs.cardano_ledger_sha }}
          CN_SHA: ${{ github.event.inputs.cardano_node_sha }}
          PL_TAG: ${{ github.event.inputs.plutus_tag }}
        run: |
          TOML="tests/conformance/upstream/sources.toml"
          apply_override() {
            local section="$1" key="$2" value="$3"
            if [[ -n "${value}" ]]; then
              python3 - "${TOML}" "${section}" "${key}" "${value}" <<'EOF'
          import sys, re
          toml_file, section, key, value = sys.argv[1:]
          with open(toml_file) as f:
              lines = f.readlines()
          in_section = False
          result = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('[') and not stripped.startswith('[['):
                  in_section = (stripped.strip('[]').strip() == section)
              if in_section and re.match(rf'^{key}\s*=', stripped):
                  line = f'{key}  = "{value}"\n'
              result.append(line)
          with open(toml_file, 'w') as f:
              f.writelines(result)
          EOF
            fi
          }
          apply_override ouroboros-consensus sha  "${OC_SHA}"
          apply_override cardano-ledger      sha  "${CL_SHA}"
          apply_override cardano-node        sha  "${CN_SHA}"
          apply_override plutus              tag  "${PL_TAG}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ── System libraries required by cardano-ledger Haskell deps ─────────────
      # cardano-crypto-class (transitive dep of cardano-ledger-core) requires:
      #   libsodium-dev    — Ed25519/ChaCha20 primitives
      #   libsecp256k1-dev — secp256k1 curve (cardano-crypto-praos)
      #   libblst          — BLS12-381 curve (NOT in ubuntu-24.04 apt; build from source)
      #   pkg-config       — used by cabal to locate these libraries
      #
      # libblst is not in Ubuntu 24.04's standard repos. We build it from the
      # supranational/blst GitHub release (same source that Cardano Nix uses).
      # The header + static lib are installed to /usr/local which pkg-config finds.
      - name: Install system libraries for Haskell build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libsodium-dev \
            libsecp256k1-dev \
            build-essential

          # Build and install libblst from source (not in Ubuntu 24.04 apt repos).
          # cardano-crypto-class 2.3+ requires libblst>=0.3.14 via pkg-config.
          # Use v0.3.14 (the minimum required by the cardano-ledger deps at the pinned SHA).
          BLST_VERSION="v0.3.14"
          git clone --depth=1 --branch "${BLST_VERSION}" \
            https://github.com/supranational/blst.git /tmp/blst
          cd /tmp/blst
          ./build.sh
          sudo install -m644 bindings/blst.h    /usr/local/include/
          sudo install -m644 bindings/blst_aux.h /usr/local/include/
          sudo install -m644 libblst.a           /usr/local/lib/
          # Create pkgconfig dir if it doesn't exist, then write the .pc file.
          sudo mkdir -p /usr/local/lib/pkgconfig
          printf 'prefix=/usr/local\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib\nincludedir=${prefix}/include\n\nName: libblst\nDescription: BLS12-381 signature library\nVersion: 0.3.14\nLibs: -L${libdir} -lblst\nCflags: -I${includedir}\n' | sudo tee /usr/local/lib/pkgconfig/libblst.pc > /dev/null
          sudo ldconfig
          cd -

      # ── Haskell toolchain (required for ledger-rules corpus generation) ──────
      # GHC 9.6.5 + cabal 3.10.x matches IntersectMBO/cardano-ledger's CI matrix
      # at the pinned SHA. The first cold run takes ~45 minutes to build the
      # ledger deps; subsequent runs restore from cache in ~10 minutes.
      - name: Set up Haskell (GHC 9.6.5 + cabal 3.10.x)
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: "9.6.5"
          cabal-version: "3.10.3.0"

      - name: Cache cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          # Key on: GHC version + OS + the ledger-rules SHA from sources.toml.
          # The SHA uniquely identifies which cardano-ledger revision we build,
          # so a pin bump automatically invalidates the cache.
          key: ${{ runner.os }}-ghc-9.6.5-cabal-${{ hashFiles('tests/conformance/upstream/sources.toml') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.6.5-cabal-

      - name: Cache ~/.cabal (downloaded packages)
        uses: actions/cache@v5
        with:
          path: ~/.cabal
          key: ${{ runner.os }}-cabal-home-${{ hashFiles('tests/conformance/upstream/sources.toml') }}
          restore-keys: |
            ${{ runner.os }}-cabal-home-

      - name: Make scripts executable
        run: chmod +x scripts/regenerate-conformance-corpus/*.sh

      - name: Run regeneration pipeline
        id: regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_AREA: ${{ github.event.inputs.area }}
        run: |
          ARGS=()
          if [[ -n "${INPUT_AREA}" ]]; then
            ARGS+=(--area "${INPUT_AREA}")
          fi
          bash scripts/regenerate-conformance-corpus/regenerate.sh "${ARGS[@]}"
          # Capture the release tag from the tarballs directory name for the verify step.
          RELEASE_TAG="$(ls target/conformance-corpus/ | sort | tail -1)"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.regenerate.outputs.release_tag }}
        run: |
          echo "Verifying release: ${LATEST_TAG}"

          ASSETS="$(gh release view "${LATEST_TAG}" --repo "${GH_REPO}" --json assets --jq '[.assets[].name]')"

          for area in ouroboros-consensus cardano-ledger cardano-node plutus ledger-rules cardano-base mithril; do
            echo "${ASSETS}" | python3 -c "import sys,json; a=json.load(sys.stdin); assert '${area}.tar.gz' in a, 'Missing asset: ${area}.tar.gz'"
            echo "  [ok] ${area}.tar.gz"
          done

          echo "${ASSETS}" | python3 -c "import sys,json; a=json.load(sys.stdin); assert 'corpus-manifest.json' in a, 'Missing corpus-manifest.json'"
          echo "  [ok] corpus-manifest.json"

          # Download and inspect the manifest.
          MANIFEST="$(gh release download "${LATEST_TAG}" --repo "${GH_REPO}" --pattern "corpus-manifest.json" --output -)"

          # ledger-rules: report stub vs real, but don't fail on stub.
          # When the Haskell build succeeds and produces vectors, stub=false and
          # file_count > 0. When GHC isn't available or no divergences occurred,
          # stub=true and file_count=0. Both are valid outcomes.
          LR_STUB="$(echo "${MANIFEST}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['areas']['ledger-rules'].get('stub', False))")"
          LR_COUNT="$(echo "${MANIFEST}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['areas']['ledger-rules'].get('file_count', 0))")"
          if [[ "${LR_STUB}" == "True" ]]; then
            echo "  [warn] ledger-rules is stub (file_count=${LR_COUNT}) — Haskell build may have been skipped or produced no divergences"
          else
            echo "  [ok] ledger-rules: ${LR_COUNT} files (non-stub)"
          fi

          # Check real areas have non-empty file_hashes.
          for real_area in ouroboros-consensus cardano-ledger cardano-node plutus cardano-base; do
            FILE_COUNT="$(echo "${MANIFEST}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['areas']['${real_area}'].get('file_count', 0))")"
            [[ "${FILE_COUNT}" -gt 0 ]] || { echo "ERROR: ${real_area} has 0 files" >&2; exit 1; }
            echo "  [ok] ${real_area}: ${FILE_COUNT} files"
          done

          echo "All verification checks passed."
