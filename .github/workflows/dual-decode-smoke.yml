name: Dual-Decode Smoke

# Run the shadow-decode harness on every PR that touches the serialization or
# primitives crates.  Any block that decodes differently between the pallas
# reference path and the in-house path will either panic (DUGITE_DUAL_DECODE=panic)
# or write a mismatch artefact — both fail the job.
#
# Target runtime: <5 min on a standard ubuntu-latest runner.
# The test suite exercises all golden fixtures, real-block round-trips,
# CDDL conformance, and encode-roundtrip tests already present in
# crates/dugite-serialization/tests/.

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/dugite-serialization/**"
      - "crates/dugite-primitives/**"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Panic on any structural divergence between decoders.
  # When the pallas-shadow-decode feature is compiled but the in-house decoder
  # is not yet wired (M3 tautological phase), this env var is a no-op and the
  # tests exercise pallas alone — still valid regression coverage.
  DUGITE_DUAL_DECODE: "panic"

jobs:
  dual-decode-smoke:
    name: dual-decode smoke (serialization + primitives)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Reuse the same cache key shape as ci.yml so the two workflows share
      # a warm build cache when they run on the same commit.
      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Build only the two crates we're testing, with the shadow feature on.
      # --features is additive on the package level; pallas-shadow-decode is
      # the default so this is a no-op until someone disables the default —
      # at which point this explicit flag re-enables it for the smoke job.
      - name: Build dugite-serialization (pallas-shadow-decode)
        run: |
          cargo build \
            -p dugite-serialization \
            -p dugite-primitives \
            --features dugite-serialization/pallas-shadow-decode

      # Run the full test suite for the two crates under DUGITE_DUAL_DECODE=panic.
      # nextest parallelises tests; panic propagates as a test failure.
      - name: Run serialization tests
        run: |
          cargo nextest run \
            -p dugite-serialization \
            --features dugite-serialization/pallas-shadow-decode \
            --no-fail-fast

      - name: Run primitives tests
        run: |
          cargo nextest run \
            -p dugite-primitives \
            --no-fail-fast

      # Extra doc-test pass (nextest cannot run these).
      - name: Run doc tests
        run: |
          cargo test --doc \
            -p dugite-serialization \
            --features dugite-serialization/pallas-shadow-decode

      # If the feature isn't compiled yet (M3 not landed), report that clearly
      # rather than silently passing.  We grep the feature list from Cargo.toml;
      # if pallas-shadow-decode is absent we note it but do NOT fail (it will
      # be absent before M3 lands, and this job should still exercise the
      # decode pipeline).
      - name: Check pallas-shadow-decode feature presence
        run: |
          if cargo metadata --no-deps --format-version 1 \
              | python3 -c "
          import json, sys
          meta = json.load(sys.stdin)
          for pkg in meta['packages']:
              if pkg['name'] == 'dugite-serialization':
                  feats = pkg.get('features', {})
                  if 'pallas-shadow-decode' in feats:
                      print('pallas-shadow-decode feature: PRESENT')
                  else:
                      print('pallas-shadow-decode feature: ABSENT (M3 not landed yet — tautological run)')
                  break
          "; then
              echo "feature check complete"
          fi

      # Check the mismatch dump directory — it should be empty (panic mode
      # means we'd have failed above, but dump mode might write files too if
      # the env var races; this is a belt-and-suspenders check).
      - name: Assert no mismatch artefacts
        run: |
          DUMP_DIR="${DUGITE_DUAL_DECODE_DUMP_DIR:-./dual_decode_mismatches}"
          if [ -d "$DUMP_DIR" ]; then
            count=$(find "$DUMP_DIR" \( -name "*.cbor" -o -name "*.diff.txt" \) | wc -l | tr -d ' ')
            if [ "$count" -gt "0" ]; then
              echo "ERROR: $count mismatch artefact(s) found in $DUMP_DIR"
              python3 scripts/validation/dual-decode-report.py "$DUMP_DIR" || true
              exit 1
            fi
          fi
          echo "No mismatch artefacts — dual-decode smoke PASS."
