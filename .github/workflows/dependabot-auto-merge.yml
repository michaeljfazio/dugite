name: Dependabot auto-merge

# Turns on auto-merge for a narrow class of Dependabot updates. GitHub then
# merges the PR only after the required checks of the `require-ci` ruleset
# pass, so this workflow decides WHICH PRs may merge unattended, never WHEN.
#
# The check FAILS CLOSED. Auto-merge is enabled only when ALL of these hold:
#   * the update is a cargo semver-PATCH update;
#   * the PR changes Cargo.lock and nothing else;
#   * every crate whose version moves in Cargo.lock is on ALLOW below.
# The gate runs on every PR event and turns auto-merge OFF whenever it
# rejects, and an approval is pinned to the head commit it checked.
# Anything else, including a diff this script cannot read, stays open for a
# human review. A deny-list would let every crate nobody thought of through;
# consensus, crypto, CBOR and big-integer crates must never be in ALLOW.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        continue-on-error: true
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate auto-merge (runs on every event; rejects revoke it)
        if: always()
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Every rejection turns auto-merge OFF, so an approval given for an
          # earlier head commit cannot carry over to content never checked.
          reject() {
            echo "$1; manual review."
            gh pr merge --disable-auto "$PR_URL" >/dev/null 2>&1 || true
            exit 0
          }
          [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || reject "update type is '${UPDATE_TYPE:-unknown}'"
          [ "$ECOSYSTEM" = "cargo" ] || reject "ecosystem is '${ECOSYSTEM:-unknown}'"

          # Crates with no path into consensus, wire formats, signatures,
          # hashing or arithmetic. Add to this list only after that check.
          ALLOW='^(anyhow|thiserror|thiserror-impl|chrono|sysinfo|clap|clap_builder|clap_derive|clap_lex|indicatif|console|ratatui|crossterm|tempfile|criterion|proptest|insta)$'

          files=$(gh pr diff "$PR_URL" --name-only) || reject "could not read the PR's files"
          [ "$files" = "Cargo.lock" ] || reject "PR changes more than Cargo.lock: $(echo $files)"

          diff=$(gh pr diff "$PR_URL") || reject "could not read the PR diff"
          # A package added to or removed from the lockfile has its name on a
          # +/- line, which the context-line match below would not see.
          if printf '%s\n' "$diff" | grep -qE '^[-+]name = '; then
            reject "lockfile adds or removes a package"
          fi

          # Crates whose version line changes in the lockfile diff.
          moved=$(printf '%s\n' "$diff" \
            | grep -B1 -E '^[-+]version = ' \
            | sed -n 's/^ name = "\(.*\)"$/\1/p' | sort -u)
          [ -n "$moved" ] || reject "could not read which crates moved"
          for crate in $moved; do
            printf '%s\n' "$crate" | grep -qE "$ALLOW" || reject "$crate is not on the allow-list"
          done

          # Pin the approval to the commit this gate checked.
          echo "Allow-listed patch update ($(echo $moved)) at $HEAD_SHA; enabling auto-merge."
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
