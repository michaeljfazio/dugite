name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: michaeljfazio/dugite

jobs:
  # ──────────────────────────────────────────────
  # Build native binaries for Linux and macOS
  # ──────────────────────────────────────────────
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dugite-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: dugite-aarch64-linux
          # x86_64-apple-darwin is dropped: GitHub's macOS runners are
          # aarch64-only, and bundled gmp-mpfr-sys (via mithril-stm → rug)
          # cannot cross-compile its x86_64 assembly under Apple Silicon
          # clang. Re-enable when GitHub adds Intel mac runners or we move
          # to a self-hosted/cross-rs build.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dugite-aarch64-macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        run: |
          if [[ "${{ matrix.os }}" == *"ubuntu"* ]]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [[ "${{ matrix.os }}" == *"macos"* ]]; then
            brew install protobuf
          fi


      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin dugite-node --bin dugite-cli
        env:
          RUSTFLAGS: "-D warnings"

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dugite-node dist/
          cp target/${{ matrix.target }}/release/dugite-cli dist/
          cp -r config dist/
          cp README.md LICENSE* dist/ 2>/dev/null || true
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ──────────────────────────────────────────────
  # Build multi-arch container images
  # ──────────────────────────────────────────────
  build-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Registry cache, not type=gha.
          #
          # The GitHub Actions cache backend has a hard 10 GB per-repo quota and
          # evicts least-recently-used entries. A `mode=max` cache for a
          # two-platform Rust build blows past that, so entries could be evicted
          # WHILE the build was still importing them — buildx then aborts with
          # `failed to solve: not_found`. That is exactly how the v2.0.16
          # release failed, after 1h55m of QEMU arm64 compilation.
          #
          # The registry backend has no such quota, lives next to the image we
          # already push, and needs no extra credentials (we are logged in to
          # ghcr.io above).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          # `ignore-error=true` so a cache EXPORT hiccup can never fail a
          # release build — the image is already pushed by then, and a cold
          # cache next time is far cheaper than a failed release.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,ignore-error=true
          labels: |
            org.opencontainers.image.title=dugite
            org.opencontainers.image.description=Cardano node implementation in Rust
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/michaeljfazio/dugite

  # ──────────────────────────────────────────────
  # Package + push the Helm chart as an OCI artifact
  # to ghcr.io/michaeljfazio/charts. Runs after the
  # container image is in place so the chart's
  # appVersion always references a pullable image.
  # ──────────────────────────────────────────────
  publish-chart:
    needs: [build-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint charts/dugite-node

      - name: Verify chart appVersion matches the release tag
        run: |
          declared=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2}' charts/dugite-node/Chart.yaml)
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Chart.yaml appVersion ($declared) != release tag (${{ steps.version.outputs.version }}). Bump charts/dugite-node/Chart.yaml before tagging." >&2
            exit 1
          fi

      - name: Package chart
        id: package
        run: |
          mkdir -p .chart-dist
          helm package charts/dugite-node \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination .chart-dist
          pkg=$(ls .chart-dist/dugite-node-*.tgz)
          echo "package=$pkg" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} \
                --password-stdin

      - name: Push chart to OCI registry
        run: |
          helm push "${{ steps.package.outputs.package }}" \
            oci://${{ env.REGISTRY }}/michaeljfazio/charts

      - name: Upload chart as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: ${{ steps.package.outputs.package }}

  # ──────────────────────────────────────────────
  # Create GitHub Release with binary assets
  # ──────────────────────────────────────────────
  create-release:
    needs: [build-binaries, publish-chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.tar.gz" -exec mv {} . \;
          find . -name "*.tgz" -exec mv {} . \;
          sha256sum *.tar.gz *.tgz > SHA256SUMS.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The CHART version is independent of the app version, and `helm --version`
      # takes the chart's. Interpolating the app version there produced an
      # install command that could not work: on v2.5.1 it emitted
      # `--version 2.5.1`, and
      #   helm show chart oci://.../dugite-node --version 2.5.1
      #   -> Error: FetchReference ... dugite-node:2.5.1: not found
      # while the pushed artefact was dugite-node-0.10.1.tgz. Read it from
      # Chart.yaml, which `publish-chart` has already verified against the tag.
      - name: Extract chart version
        id: chart
        run: |
          cv=$(awk '/^version:/{print $2; exit}' charts/dugite-node/Chart.yaml)
          if [ -z "$cv" ]; then
            echo "::error::could not read version from charts/dugite-node/Chart.yaml" >&2
            exit 1
          fi
          echo "chart_version=$cv" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Dugite ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tgz
            artifacts/SHA256SUMS.txt
          body: |
            ## Container Image

            ```bash
            docker pull ghcr.io/michaeljfazio/dugite:${{ steps.version.outputs.version }}
            ```

            Available for `linux/amd64` and `linux/arm64`.

            ## Helm Chart

            ```bash
            helm install dugite-relay \
              oci://ghcr.io/michaeljfazio/charts/dugite-node \
              --version ${{ steps.chart.outputs.chart_version }} \
              --set network.name=preview
            ```

            See [Kubernetes Deployment](https://michaeljfazio.github.io/dugite/running/kubernetes.html) for the full chart reference.

            ## Binary Downloads

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | Linux | x86_64 | `dugite-x86_64-linux.tar.gz` |
            | Linux | aarch64 | `dugite-aarch64-linux.tar.gz` |
            | macOS | Apple Silicon | `dugite-aarch64-macos.tar.gz` |

            Verify checksums: `sha256sum -c SHA256SUMS.txt`

            macOS x86_64 is not published: GitHub's macOS runners are Apple
            Silicon only, and `gmp-mpfr-sys` (via `mithril-stm` → `rug`) cannot
            cross-compile its x86_64 assembly under Apple Silicon clang. Build
            from source on an Intel Mac if you need it.
